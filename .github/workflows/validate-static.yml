name: Validate static release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required deployment files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            public/index.html
            public/_headers
            public/_redirects
            public/favicon.svg
            public/manifest.webmanifest
            public/robots.txt
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Validate application shell and routing
        shell: bash
        run: |
          set -euo pipefail
          grep -qi '<!doctype html' public/index.html
          grep -qi '<title' public/index.html
          grep -q '/\* /index.html 200' public/_redirects
          grep -q 'Content-Security-Policy:' public/_headers
          grep -q 'Strict-Transport-Security:' public/_headers
          grep -q 'Disallow: /' public/robots.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check inline script blocks parse
        shell: bash
        run: |
          set -euo pipefail
          node -e "
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const blocks = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].map(m => m[1]);
          if (!blocks.length) { console.error('No inline <script> blocks found.'); process.exit(1); }
          blocks.forEach((block, i) => {
            if (!block.trim()) return;
            const tmp = '/tmp/_inline_script_' + i + '.js';
            fs.writeFileSync(tmp, block);
            execFileSync('node', ['--check', tmp], { stdio: 'inherit' });
          });
          console.log(blocks.length + ' inline script block(s) parsed successfully.');
          "

      - name: Validate referral resource data integrity
        shell: bash
        run: |
          set -euo pipefail
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const start = html.indexOf('const resources = [');
          const end = html.indexOf('\n' + 'const categoryTiles');
          if (start === -1 || end === -1) { console.error('Could not locate the resources array in public/index.html.'); process.exit(1); }
          const resources = eval(html.slice(start, end).replace('const resources = ', ''));
          const validColors = new Set(['mint','blue','lavender','peach','rose','gold']);
          const required = ['id','name','type','color','icon','route','fit','action','contact','sourceUrl','best','notIdeal','patient','staff'];
          const problems = [];
          const seenIds = new Set();
          resources.forEach((r) => {
            required.forEach((k) => { if (r[k] === undefined || r[k] === null || r[k] === '') problems.push(r.id + ': missing/empty \"' + k + '\"'); });
            if (!validColors.has(r.color)) problems.push(r.id + ': invalid color \"' + r.color + '\"');
            if (r.sourceUrl && !/^https?:\/\//.test(r.sourceUrl)) problems.push(r.id + ': malformed sourceUrl \"' + r.sourceUrl + '\"');
            if (!Array.isArray(r.categories) || !r.categories.length) problems.push(r.id + ': missing categories');
            if (seenIds.has(r.id)) problems.push(r.id + ': duplicate id');
            seenIds.add(r.id);
          });
          console.log(resources.length + ' referral resources checked.');
          if (problems.length) {
            problems.forEach((p) => console.error(' - ' + p));
            process.exit(1);
          }
          console.log('No data-integrity problems found.');
          "

      - name: Reject common accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=.github --exclude='*.md' \
            '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AWS_SECRET_ACCESS_KEY|CLOUDFLARE_API_TOKEN|GITHUB_TOKEN=)' .; then
            echo 'Possible secret detected.'
            exit 1
          fi
